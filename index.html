<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YJP 面試刷題</title>
    
    <meta name="apple-mobile-web-app-title" content="YJP">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2942/2942258.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-select { -webkit-user-select: none; user-select: none; }
        ::-webkit-scrollbar { height: 4px; width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        
        /* 隱藏原生滾動條，但保留滾動功能 (針對過濾器標籤) */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 題庫 (已加入 BEP 四大核心新題目)
        const QUESTIONS = [
          { id: 1, cc: "CC1", q: "請解釋一下 ISO 19650 和傳統的 BS1192 有什麼核心區別？", a: "BS1192 是前身，角色劃分繁瑣；ISO 19650 是國際版，大幅簡化為 3 個核心項目角色，旨在減少全球通用時的理解偏差。" },
          { id: 2, cc: "CC1", q: "香港政府近年對 BIM 的強制要求是什麼？", a: "2018年起造價 3000 萬港元以上的政府工程必須採用 BIM；近年更強調與 AM/FM（設施管理）的整合。" },
          { id: 3, cc: "CC1", q: "解釋 LOD（發展程度）400 和 500 的區別。", a: "LOD 400 包含尺寸小於50mm的專業加工細節，支持預製生產；LOD 500 是竣工交付級。但在 CIC 標準中，LOD 500 已不適用於圖形(LOD-G)。" },
          { id: 4, cc: "CC1", q: "你如何理解 OIR, PIR, AIR 和 EIR 之間的關係？", a: "OIR是組織戰略需求；向下推導到專案級PIR和資產級AIR；最後綜合形成合約落地的 EIR(交換資訊需求)。" },
          { id: 5, cc: "CC1", q: "[場景] 業主完全不懂 BIM，你如何向他解釋 BIM 的價值？", a: "BIM 最大的價值是“一改全改 (Change one change many)”。它是結構化數據庫，修改一扇門，所有圖紙和排程自動更新，極大降低返工成本。" },
          { id: 6, cc: "CC1", q: "什麼是 LOIN (Level of Information Need)？它包含哪三個維度？", a: "LOIN 取代了傳統單一的 LOD。它包含三個維度：LOD-G (圖形細節)、LOD-I (資訊細節) 以及 DOC (文件，如合約圖紙)。" },
          
          { id: 7, cc: "CC2", q: "什麼是 OpenBIM？IFC 和 BCF 分別解決什麼問題？", a: "OpenBIM 強調軟體中立。IFC 是核心數據架構的“凍結副本”；BCF 是專門用於“跨軟體交換設計問題”的通信格式，自帶三維定位。" },
          { id: 8, cc: "CC2", q: "在基礎設施項目中，你主要使用哪些工具？", a: "Civil 3D, Revit, Navisworks 組合。海外大項目（如 NEOM）則常使用 Bentley 體系的 OpenRoads Designer 和 ProjectWise。" },
          { id: 9, cc: "CC2", q: "[場景] 現成的軟體處理地下管線非常繁瑣耗時，你如何解決？", a: "提出我開發的 C# .NET 插件。直接讀取 2D Shapefile 的屬性和幾何數據，自動生成 3D 實體，徹底消除手動重繪和人為錯誤。" },
          { id: 10, cc: "CC2", q: "[場景] 隧道項目中，曲面和結構的幾何參數極其複雜，你怎麼辦？", a: "利用 Dynamo 腳本，將 Civil 3D 的路線數據 (Alignment) 與 Revit 族結合，實現自動化、參數化的隧道結構生成。" },
          { id: 11, cc: "CC2", q: "[場景] 現場掃描了點雲數據 (LiDAR) 後，模型更新的難點在哪裡？", a: "自動化掃描容易有遮擋遺漏。必須安排人員現場核對計數，且掃描後第一時間在辦公室同步更新模型，切忌收尾才更新。" },
          
          { id: 12, cc: "CC3", q: "一個標準的 BEP (BIM 執行計畫) 通常包含哪四個核心部分？", a: "1) 專案資訊與目標；2) 關鍵人員與角色；3) BIM 流程與管理 (含建模、協調、具體 BIM Uses)；4) 數據交換與標準。" },
          { id: 13, cc: "CC3", q: "請列舉你實操過的 4 種以上 BIM 用途 (BIM Uses)。", a: "Design Authoring (參數化建模), Spatial Coordination (空間協調/碰撞檢測), Phase Planning (4D施工模擬), Cost Estimation (5D估算)。" },
          { id: 14, cc: "CC3", q: "[場景] 業主問你：“虛擬施工 (VP) 環節，哪些地方沒做好會導致翻車？”", a: "拋出“三字訣”：版、人、台。1. 版本（軟硬體版本錯亂）；2. 人員（權責需清晰）；3. 平台（CDE的算力和權限設置決定效率）。" },
          { id: 15, cc: "CC3", q: "[場景] 碰撞檢測 (Clash Detection) 後生成了幾千個衝突，你如何高效處理？", a: "設置碰撞矩陣優先級。利用 BCF 格式將衝突直接發送到工程師的原生軟體中，召開協調會議實時漫遊，現場討論修改方案。" },
          { id: 16, cc: "CC3", q: "MIDP 和 TIDP 有什麼區別？", a: "TIDP (任務資訊交付計畫) 由各個 Task Team 負責編製；MIDP (主資訊交付計畫) 由 Lead Consultant 統整所有 TIDP，用以管控整體交付里程碑。" },
          
          { id: 17, cc: "CC4", q: "CDE (公共數據環境) 必須具備哪四個核心狀態文件夾？", a: "WIP (工作中) -> Shared (共享，需審核) -> Published (發布，用於合約交付) -> Archive (歸檔，保留交易審計軌跡)。" },
          { id: 18, cc: "CC4", q: "什麼是 COBie？它與 AIM (資產信息模型) 有什麼關係？", a: "COBie 是標準化的表格數據格式，用於在施工階段結構化收集設備信息，並在竣工時導入業主的設施管理 (FM) 系統中形成 AIM。" },
          { id: 19, cc: "CC4", q: "在 CDE 中，檔案要從 WIP 進入 Shared，必須經過哪三個步驟？", a: "必須經過 Task Team 內部的 Check (作者檢查)、Review (BIM Coordinator 審查)、與 Approve (Task Team Lead 核准)。" },
          { id: 20, cc: "CC4", q: "[場景] 同事把所有模型和文檔打成一個ZIP大包發給業主，有什麼風險？", a: "會導致人員無法檢索內容。必須按模塊拆分歸檔，並在 BIM 模型內嵌入可點擊的文檔鏈接 (Document Link)，交付前做二次檢查。" },
          { id: 21, cc: "CC4", q: "在 CDE 的版本控制中，Revision 和 Version 有什麼區別？", a: "Version 用於 WIP 階段的內部迭代 (如 P01.1, P01.2)；Revision 是正式發布的版次 (如 P01, P02 為初步/施工前，C01 為施工用)。" },
          
          { id: 22, cc: "CC5", q: "BIM 模型如果在合同中不明確，會導致什麼商業風險？", a: "容易出現“過度建模 (Over-model)”浪費成本，或“建模不足 (Under-model)”達不到驗收標準。" },
          { id: 23, cc: "CC5", q: "關於 BIM 模型的知識產權 (IP)，通用法則是怎樣的？", a: "模型 IP 歸原設計作者所有，業主通過合同購買獲得“使用授權”。未經授權，其他項目團隊不可挪用。" },
          { id: 24, cc: "CC5", q: "[場景] 傳統項目後期變更成本極高。引入 BIM 後你在商業上有什麼改變？", a: "推動“工作重心前移 (Front-loading)”。在前期多花精力利用 3D 模型打磨方案，消除空間衝突，大幅削減施工階段的高昂變更單風險。" },
          { id: 25, cc: "CC5", q: "[場景] 你要在 PS 規範中加入 BIM 條款，最關鍵要寫明什麼？", a: "明確“Client's BIM Models”的法定地位（Native 還是 Open 格式具有約束力），界定好 MIDP 的交付節點。" },
          { id: 26, cc: "CC5", q: "[場景] 分包商以“成本太高”為由拒絕提交 BIM 模型，你前期如何處理？", a: "在合同前置階段就將各方納入體系。制定明確的《准入信息計劃表》，提供統一的參數填報模板，通過早期培訓降低執行門檻。" },
          
          { id: 27, cc: "CC6", q: "在向非技術高管匯報 BIM 進度時，你主要展示什麼？", a: "不談軟體細節，只展示核心數據儀表盤、資金流程節點調整、碰撞規避節省的預估成本，以及 4D 進度模擬。" },
          { id: 28, cc: "CC6", q: "BIM 項目中，你認為最有效的溝通工具是什麼？", a: "不是郵件或 2D 圖紙，而是帶有問題定位、責任人追蹤狀態的閉環協作平台（如 ACC Issues 或基於 BCF 的工具）。" },
          { id: 29, cc: "CC6", q: "[場景] 公司裡許多資深工程師習慣用2D畫好丟給建模員去“翻模”，你如何改變？", a: "我會組織“數字化轉型”培訓，將枯燥規範轉化為實際流程。編寫“C# 插件使用手冊”，用提升效率的實際工具去打動他們。" },
          { id: 30, cc: "CC6", q: "[場景] 跨專業協調會上機電和結構互不相讓，你如何主持大局？", a: "利用 Federated Model 實時漫遊。不強行替他們做決定，而是提供空間數據，引導雙方在 3D 視圖中討論改道路線，會後立刻發放 Action Items。" }
        ];

        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [filterCC, setFilterCC] = useState('ALL'); // 新增：過濾狀態
            const [mode, setMode] = useState('ALL'); // 'ALL' 測驗, 'REVIEW' 錯題
            const [reviewList, setReviewList] = useState([]);
            const [activeQueue, setActiveQueue] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            const [options, setOptions] = useState([]);
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [isFinished, setIsFinished] = useState(false);

            // 讀取/保存錯題本
            useEffect(() => {
                const saved = localStorage.getItem('yjp_ccbm_review');
                if (saved) {
                    try { setReviewList(JSON.parse(saved)); } catch (e) {}
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('yjp_ccbm_review', JSON.stringify(reviewList));
            }, [reviewList]);

            // 當過濾器或模式改變時，重新生成題庫隊列
            useEffect(() => {
                startSession(mode, filterCC);
            }, [mode, filterCC]);

            const shuffleArray = (array) => {
                let newArr = [...array];
                for (let i = newArr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
                }
                return newArr;
            };

            const startSession = (currentMode, currentFilter) => {
                // 步驟 1: 根據 CC 分類過濾
                let filteredData = QUESTIONS;
                if (currentFilter !== 'ALL') {
                    filteredData = QUESTIONS.filter(q => q.cc === currentFilter);
                }

                // 步驟 2: 根據模式過濾 (全部 vs 錯題)
                let pool = currentMode === 'ALL' ? [...filteredData] : filteredData.filter(q => reviewList.includes(q.id));
                
                if (pool.length > 0) {
                    setActiveQueue(shuffleArray(pool));
                    setCurrentIndex(0);
                    setIsFinished(false);
                } else {
                    setActiveQueue([]);
                    setIsFinished(true);
                }
            };

            // 生成選擇題選項 (加入干擾項)
            useEffect(() => {
                if (activeQueue.length > 0 && currentIndex < activeQueue.length) {
                    const currentQ = activeQueue[currentIndex];
                    // 為了干擾項更逼真，優先從同一個 CC 模塊中抓取錯誤答案
                    let others = QUESTIONS.filter(q => q.id !== currentQ.id && q.cc === currentQ.cc);
                    if (others.length < 3) {
                        others = QUESTIONS.filter(q => q.id !== currentQ.id); // 數量不夠就從全局抓
                    }
                    
                    const shuffledOthers = shuffleArray(others);
                    const distractors = shuffledOthers.slice(0, 3).map(q => q.a);
                    
                    setOptions(shuffleArray([currentQ.a, ...distractors]));
                    setSelectedOpt(null); 
                }
            }, [currentIndex, activeQueue]);

            const handleSelect = (opt) => {
                if (selectedOpt !== null) return;
                setSelectedOpt(opt);
                
                const currentQ = activeQueue[currentIndex];
                const isCorrect = opt === currentQ.a;
                
                let newReviewList = [...reviewList];
                if (!isCorrect) {
                    if (!newReviewList.includes(currentQ.id)) newReviewList.push(currentQ.id);
                } else {
                    newReviewList = newReviewList.filter(id => id !== currentQ.id);
                }
                setReviewList(newReviewList);
            };

            const handleNext = () => {
                if (currentIndex < activeQueue.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                } else {
                    setIsFinished(true);
                }
            };

            // 統計各 CC 的題目數量
            const getCCCount = (cc) => {
                let count = QUESTIONS.filter(q => q.cc === cc).length;
                if (mode === 'REVIEW') {
                    count = QUESTIONS.filter(q => q.cc === cc && reviewList.includes(q.id)).length;
                }
                return count;
            };

            const totalCount = mode === 'ALL' ? QUESTIONS.length : reviewList.length;

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto relative pb-10 bg-slate-50">
                    
                    {/* Header */}
                    <div className="px-4 py-4 bg-white shadow-sm flex items-center justify-between relative z-10">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-sm">YJP</div>
                            <h1 className="font-bold text-slate-800 text-lg tracking-wide">CCBM 實戰題庫</h1>
                        </div>
                    </div>

                    {/* CC 分類過濾器 (橫向滑動) */}
                    <div className="bg-white border-b border-slate-100 py-3 px-2">
                        <div className="flex overflow-x-auto hide-scroll gap-2 px-2 pb-1">
                            <button 
                                onClick={() => setFilterCC('ALL')}
                                className={`flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-bold border transition-all ${filterCC === 'ALL' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-500 border-slate-200'}`}
                            >
                                全部分類 ({totalCount})
                            </button>
                            {['CC1', 'CC2', 'CC3', 'CC4', 'CC5', 'CC6'].map(cc => (
                                <button 
                                    key={cc}
                                    onClick={() => setFilterCC(cc)}
                                    className={`flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-bold border transition-all ${filterCC === cc ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-200' : 'bg-white text-slate-500 border-slate-200'}`}
                                >
                                    {cc} ({getCCCount(cc)})
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* 模式切換 (全部 / 錯題) */}
                    <div className="px-4 mt-4 mb-2">
                        <div className="flex bg-slate-200 p-1 rounded-xl">
                            <button 
                                onClick={() => setMode('ALL')}
                                className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${mode === 'ALL' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}
                            >
                                隨機測驗
                            </button>
                            <button 
                                onClick={() => setMode('REVIEW')}
                                className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${mode === 'REVIEW' ? 'bg-white shadow text-rose-600' : 'text-slate-500'}`}
                            >
                                專攻錯題
                            </button>
                        </div>
                    </div>

                    {/* 答題區域 */}
                    <div className="flex-1 px-4 flex flex-col mt-2 mb-8">
                        
                        {isFinished ? (
                            <div className="flex flex-col items-center justify-center flex-1 bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center mt-4">
                                <div className="text-6xl mb-4">🎯</div>
                                <h2 className="text-xl font-bold mb-2 text-slate-800">
                                    {mode === 'REVIEW' && activeQueue.length === 0 ? "太棒了！錯題已清空！" : `${filterCC !== 'ALL' ? filterCC : '全部分類'} 刷題完成！`}
                                </h2>
                                <p className="text-slate-500 text-sm mb-6">點擊上方過濾器切換其他模塊，或重新開始測驗。</p>
                                <button onClick={() => startSession(mode, filterCC)} className="w-full py-3.5 bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-200 font-bold active:bg-blue-700">
                                    再刷一次
                                </button>
                            </div>
                        ) : (
                            <>
                                <div className="flex justify-between items-end mb-2 px-1">
                                    <span className="text-xs font-bold text-slate-400">Q {currentIndex + 1} / {activeQueue.length}</span>
                                    <span className="text-xs font-bold text-blue-600">{Math.round((currentIndex / activeQueue.length) * 100)}%</span>
                                </div>
                                <div className="w-full h-1.5 bg-slate-200 rounded-full mb-6 overflow-hidden">
                                    <div className="h-full bg-blue-600 transition-all duration-300" style={{ width: `${(currentIndex / activeQueue.length) * 100}%` }}></div>
                                </div>

                                <div className="w-full bg-white shadow-lg shadow-slate-200/50 rounded-2xl p-6 mb-6 border border-slate-50">
                                    <div className="mb-3">
                                        <span className="px-3 py-1 bg-blue-50 text-blue-600 text-xs font-bold rounded-full">{currentQ.cc}</span>
                                    </div>
                                    <h3 className="text-xl font-bold leading-snug text-slate-800">{currentQ.q}</h3>
                                </div>

                                <div className="flex flex-col gap-3">
                                    {options.map((opt, idx) => {
                                        const isSelected = selectedOpt === opt;
                                        const isCorrectAnswer = opt === currentQ.a;
                                        let btnStyle = "bg-white border border-slate-200 text-slate-700 shadow-sm active:bg-slate-50";
                                        let icon = null;

                                        if (selectedOpt !== null) {
                                            if (isCorrectAnswer) {
                                                btnStyle = "bg-green-50 border-2 border-green-500 text-green-800 font-bold shadow-md shadow-green-100/50";
                                                icon = "✅";
                                            } else if (isSelected) {
                                                btnStyle = "bg-rose-50 border-2 border-rose-500 text-rose-800 font-bold shadow-md shadow-rose-100/50";
                                                icon = "❌";
                                            } else {
                                                btnStyle = "bg-white border-2 border-slate-100 text-slate-400 opacity-50"; 
                                            }
                                        }

                                        return (
                                            <button 
                                                key={idx} onClick={() => handleSelect(opt)} disabled={selectedOpt !== null}
                                                className={`w-full text-left p-4 rounded-xl transition-all duration-200 ${btnStyle}`}
                                            >
                                                <div className="flex gap-3">
                                                    <div className="flex-shrink-0 mt-0.5">
                                                        {icon ? icon : <span className="w-5 h-5 rounded-full border-2 border-slate-200 block"></span>}
                                                    </div>
                                                    <p className="text-[15px] leading-relaxed">{opt}</p>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>

                                {selectedOpt !== null && (
                                    <div className="mt-8 animate-fade-in">
                                        <button onClick={handleNext} className="w-full py-4 bg-slate-800 active:bg-slate-900 text-white rounded-xl font-bold shadow-xl flex items-center justify-center">
                                            下一題
                                        </button>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
